services:
  - type: web
    name: dermaai-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://gen.ai.kku.ac.th/api/v1
      - key: LLM_MODEL
        value: gemini-3.1-pro-preview
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
